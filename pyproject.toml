# Packaging only: makes src/resolvedesk importable (pip install -e .).
# Dependencies are locked in requirements.txt / requirements-dev.txt.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resolvedesk"
version = "0.1.0"
description = "Customer-facing multi-agent support chat for e-commerce"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py312"
